<div class="section-wrapper">

    <!-- HEADER -->
    <div class="section-header">

        <div class="section-title">

            <h2>
                Company Overview
            </h2>

            <p>Key performance at a glance</p>

        </div>

    </div>


    <!-- STATS -->
    <div class="stats-grid">

        <!-- TOTAL ORDERS -->
        <div class="stat-card">

            <div class="stat-label">
                Total Orders
            </div>

            <div class="stat-value">
                {{count}}
            </div>

            <div class="stat-change">
                <i class="fa fa-check"></i>
                Platform total
            </div>

        </div>


        <!-- REVENUE -->
        <div class="stat-card">

            <div class="stat-label">
                Total Revenue
            </div>

            <div class="stat-value">
                ₹{{revenue}}
            </div>

            <div class="stat-change">
                <i class="fa fa-line-chart"></i>
                Revenue tracked
            </div>

        </div>

    </div>


    <!-- CONTENT BLOCK -->
    <div class="content-block">

        <div class="block-header">

            <h3>
                Dashboard Summary
            </h3>

        </div>

        <div class="summary-grid">
            <div><span>Workspace</span><strong>Operations center</strong></div>
            <div><span>Focus</span><strong>Orders, products, customers</strong></div>
            <div><span>Access</span><strong>Administrator</strong></div>
        </div>

    </div>

</div>
