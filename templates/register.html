<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Zioraa | Register</title>
  <link rel="icon" type="image/png" href="{{ url_for('static', filename='images/logo.png') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/common.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/login.css') }}">
</head>
<body>
  <main class="auth-shell">
    <a class="auth-logo" href="/">
      <img src="{{ url_for('static', filename='images/name.png') }}" alt="Zioraa">
    </a>
    <div class="auth-layout">
      <section class="auth-form-panel">
        <div class="tab">
          <a href="/login">Login</a>
          <a class="active" href="/register">Register</a>
        </div>
        <form id="register-form" action="{{ url_for('auth.add_user') }}" method="POST">
          <h2>Create an Account</h2>
          <input type="text" name="name" placeholder="Full Name" aria-label="Full Name" required>
          <input type="email" name="email" placeholder="Email" aria-label="Email" required>
          <input type="password" name="pass" placeholder="Password" aria-label="Password" required>
          <input type="password" name="cpass" placeholder="Confirm Password" aria-label="Confirm Password" required>
          <button type="submit" class="abtn">Create account <span>→</span></button>
          <div class="switch">Already have an account? <a href="/login">Login</a></div>
        </form>
      </section>
    </div>
  </main>
</body>
</html>
