<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Zioraa | Login</title>
  <link rel="icon" type="image/png" href="{{ url_for('static', filename='images/logo.png') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/common.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/login.css') }}">
</head>
<body>
  <main class="auth-shell">
    <a class="auth-logo" href="/">
      <img src="{{ url_for('static', filename='images/name.png') }}" alt="Zioraa">
    </a>
    <div class="auth-layout">
      <section class="auth-form-panel">
        <div class="tab">
          <a class="active" href="/login">Login</a>
          <a href="/register">Register</a>
        </div>
        <form id="login-form" action="{{ url_for('auth.authenticate') }}" method="POST">
          <h2>Login to Zioraa</h2>
          <input type="email" name="email" placeholder="Email" aria-label="Email" required>
          <input type="password" name="password" placeholder="Password" aria-label="Password" required>
          <div class="forgot-password"><a href="/password">Forgot password?</a></div>
          <button type="submit" class="abtn">Login <span>→</span></button>
          <div class="switch">Don’t have an account? <a href="/register">Register</a></div>
        </form>
      </section>
    </div>
  </main>
</body>
</html>
